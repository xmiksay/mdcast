[package]
name = "mdcast-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared data types and HTTP wire protocol for mdcast — serde-only, no engine dependencies"
documentation = "https://docs.rs/mdcast-api"
keywords = ["markdown", "mdcast", "document", "http", "api"]
categories = ["text-processing", "api-bindings"]

[dependencies]
serde = { workspace = true }

# serde_json is a test-only dependency on purpose: the wire types are plain
# serde structs, so nothing here needs a concrete format at build time.
[dev-dependencies]
serde_json = "1"
