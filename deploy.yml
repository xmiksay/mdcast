# k8s deployment for mdcast-server: Secret + ConfigMap + Deployment + Service
# in the `services` namespace, image from GHCR. Deliberately **no Ingress** —
# the renderer is internal-only; consumers reach it at
# http://mdcast.services (port 80 → 8080) inside the cluster.
#
#   make deploy           # kubectl apply -f deploy.yml
#   make deploy-restart   # re-roll the pods to pick up Secret/ConfigMap edits
#
# New release: bump the pinned image tag below, then `make deploy`.
#
# The committed Secret is a placeholder — keep the real MDCAST_TOKEN only in
# your local copy (kubectl apply overwrites the in-cluster secret with this
# file). Rotate: edit locally, `make deploy`, `make deploy-restart`.
apiVersion: v1
kind: Secret
metadata:
  name: mdcast
  namespace: services
type: Opaque
stringData:
  MDCAST_TOKEN: "change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mdcast
  namespace: services
data:
  RUST_LOG: "info"
  # cli mode (issue #73): every typst compile is a killable subprocess with
  # the timeout (MDCAST_TYPST_TIMEOUT_SECS) and address-space cap below — a pathological
  # template can't wedge a worker thread for the pod's lifetime.
  MDCAST_TYPST: "cli"
  MDCAST_TYPST_MAX_MEMORY_BYTES: "1073741824"
  # Headroom for node CPU contention: a render measured at ~1s of CPU was
  # observed stretching past the default 30s wall-clock kill when the node
  # was loaded. Kept well below the site client's 120s request timeout:
  # this bounds only the typst child, the rest of the request comes on top.
  MDCAST_TYPST_TIMEOUT_SECS: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdcast
  namespace: services
  labels:
    app: mdcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdcast
  template:
    metadata:
      labels:
        app: mdcast
    spec:
      # The server drains in-flight renders on SIGTERM; give the longest one
      # (MDCAST_TYPST_TIMEOUT_SECS) time to finish before the SIGKILL.
      terminationGracePeriodSeconds: 110
      containers:
        - name: mdcast
          # Pinned to the release tag, not :latest — an Always-pull of
          # :latest was observed resolving to a stale image through a
          # registry-edge cache right after a push; a version tag makes the
          # rollout deterministic. Bump in each release PR, `make deploy`
          # once the tag's image is published.
          image: ghcr.io/xmiksay/mdcast:0.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: mdcast
            - configMapRef:
                name: mdcast
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
          # Memory limit covers the in-memory blob cache (256 MiB default
          # budget) plus concurrent renders; the CPU limit keeps a burst of
          # typst/pandoc compiles from starving the node. The 1-CPU request
          # is the flip side: typst is CPU-bound, and a 100m guarantee let a
          # loaded node throttle a ~1s compile past the 30s kill window.
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mdcast
  namespace: services
spec:
  selector:
    app: mdcast
  ports:
    - name: http
      port: 80
      targetPort: 8080
