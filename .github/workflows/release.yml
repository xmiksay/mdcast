name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_BUILD_JOBS: 4

jobs:
  # Publish to crates.io on every version tag. Authenticates via crates.io
  # Trusted Publishing (OIDC) — no long-lived registry token in secrets.
  # (Each crate needs its *own* trusted publisher configured on crates.io —
  # one publisher does not cover a whole workspace. Trusted publishing cannot
  # create a crate that doesn't exist yet: a brand-new crate's first publish
  # is a one-time manual `cargo publish` with an API token, after which its
  # trusted publisher can be configured and this workflow takes over. The
  # skip-if-published guard below is what lets a tag run cleanly right after
  # such a bootstrap — and makes re-running a partially failed run safe.)
  #
  # Three crates, published in dependency order: both `mdcast` and
  # `mdcast-client` depend on `mdcast-api` by version, so the API crate must
  # be on the registry first. `cargo publish` blocks until each upload is
  # available in the index, so every command can rely on the ones before it.
  # `mdcast-client` deliberately does **not** depend on `mdcast` (see
  # PROJECT_PLAN.md §7.1) — it goes last only to keep the order stable.
  #
  # No `make verify` re-run here: the tagged commit is a just-merged,
  # CI-green master commit (ci.yml's `test` job already ran on its PR and
  # again on merge), and `cargo publish` performs its own verification
  # build. We only assert that commit actually has a passing `test` run
  # before publishing on top of it.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # All three crates inherit `version` from [workspace.package], so this
      # also proves they are in lockstep. deploy.yml pins the image to the
      # release tag, so a release PR that forgot to bump it fails here.
      - name: Verify tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for crate in mdcast-api mdcast mdcast-client; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            if [ "$tag" != "$version" ]; then
              echo "Tag v$tag does not match $crate version $version" >&2
              exit 1
            fi
          done
          if ! grep -qxF "          image: ghcr.io/xmiksay/mdcast:${tag}" deploy.yml; then
            echo "deploy.yml does not pin ghcr.io/xmiksay/mdcast:${tag}" >&2
            exit 1
          fi

      - name: Verify tag commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "test")] | sort_by(.started_at) | last | .conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "Tag commit ${GITHUB_SHA} has no successful 'test' check run (found: ${conclusion:-none})" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # All three names share the `md/ca/` sparse-index prefix. A 404 from
      # the index means the crate has never been published — fall through to
      # `cargo publish`, which is where a missing trusted publisher (or a
      # crate awaiting its manual bootstrap) surfaces as an auth error.
      - name: Publish (dependency order, skipping already-published versions)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in mdcast-api mdcast mdcast-client; do
            if curl -sf "https://index.crates.io/md/ca/${crate}" | jq -r '.vers' | grep -qx "$version"; then
              echo "${crate} ${version} is already on crates.io — skipping"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
