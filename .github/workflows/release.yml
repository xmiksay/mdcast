name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_BUILD_JOBS: 4

jobs:
  # Publish to crates.io on every version tag. Authenticates via crates.io
  # Trusted Publishing (OIDC) — no long-lived registry token in secrets.
  # (`mdcast-api` and `mdcast-client` each need their *own* trusted publisher
  # configured on crates.io — a pending publisher per crate, since neither
  # exists there until its first tagged release. One publisher does not cover
  # a whole workspace.)
  #
  # Three crates, published in dependency order: both `mdcast` and
  # `mdcast-client` depend on `mdcast-api` by version, so the API crate must
  # be on the registry first. `cargo publish` blocks until each upload is
  # available in the index, so every command can rely on the ones before it.
  # `mdcast-client` deliberately does **not** depend on `mdcast` (see
  # PROJECT_PLAN.md §7.1) — it goes last only to keep the order stable.
  #
  # No `make verify` re-run here: the tagged commit is a just-merged,
  # CI-green master commit (ci.yml's `test` job already ran on its PR and
  # again on merge), and `cargo publish` performs its own verification
  # build. We only assert that commit actually has a passing `test` run
  # before publishing on top of it.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # All three crates inherit `version` from [workspace.package], so this
      # also proves they are in lockstep.
      - name: Verify tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for crate in mdcast-api mdcast mdcast-client; do
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            if [ "$tag" != "$version" ]; then
              echo "Tag v$tag does not match $crate version $version" >&2
              exit 1
            fi
          done

      - name: Verify tag commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "test")] | sort_by(.started_at) | last | .conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "Tag commit ${GITHUB_SHA} has no successful 'test' check run (found: ${conclusion:-none})" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish mdcast-api
        run: cargo publish --locked -p mdcast-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish mdcast
        run: cargo publish --locked -p mdcast
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish mdcast-client
        run: cargo publish --locked -p mdcast-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
